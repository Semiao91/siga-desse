name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test-and-build:
    name: Test, type-check, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- --run

      - name: Type-check and build
        run: npm run build
